# [ROTEIRO-1c-CONEXAO] Único serviço: PostgreSQL 17. O backend (Fase 2) conecta via
# DB_URL/DB_USER/DB_PASSWORD, as mesmas variáveis usadas aqui para criar o banco.
# Porta do host em 55432 (não a padrão 5432) para não conflitar com um Postgres
# local ou com outro projeto que já use a porta padrão nesta máquina.
services:
  postgres:
    image: postgres:17-alpine
    container_name: locadora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME no .env (copie .env.example)}
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env (copie .env.example)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env (copie .env.example)}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - locadora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  locadora_pgdata:
    name: locadora_pgdata
